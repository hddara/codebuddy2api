# Docker Swarm stack definition for the production deployment.
#
# Deployed on the server with:
#   docker stack deploy -c swarm-stack.yml codebuddy2api
#
# Every secret is injected through the environment instead of being written
# here, so this file is safe to keep in version control. Provide the values in
# the shell that runs `docker stack deploy`, or switch the entries below to
# `docker secret` references.
#
# Notes specific to `docker stack deploy`:
#   - `container_name` and `restart` are compose-only keys and are ignored by
#     swarm; `deploy.restart_policy` is used instead.
#   - `depends_on` only affects startup order, it does not wait for the
#     database to accept connections.
#   - `env_file` is not supported by `docker stack deploy` (`docker compose`
#     only), so the variables are listed explicitly below.

version: '3.8'

services:
  app:
    # Keep this in step with what is actually running. On 2026-10-23 the stack
    # defined 20261021.T01 while the service ran 20261023.T01, so a redeploy
    # would silently have rolled the fix back to an older build.
    image: registry.cn-hangzhou.aliyuncs.com/hucx/codebuddy2api:20261028.T07
    ports:
      - '8001:8001'
    environment:
      # Storage backend. Point it at Postgres to use the shared database, or
      # set it to `file` to fall back to the plaintext JSON documents under
      # /app/.codebuddy_creds.
      - CODEBUDDY_STORAGE_BACKEND=${CODEBUDDY_STORAGE_BACKEND:-pg}
      - DATABASE_URL=${DATABASE_URL}
      # Key used to encrypt the documents stored in the database. Keep it in a
      # password manager: without it the encrypted documents cannot be read
      # back, and changing it makes the existing ones undecryptable.
      - CODEBUDDY_STORAGE_ENCRYPTION_KEY=${CODEBUDDY_STORAGE_ENCRYPTION_KEY}
      # Console password and gateway authentication mode.
      - CODEBUDDY_PASSWORD=${CODEBUDDY_PASSWORD}
      - CODEBUDDY_GATEWAY_AUTH=${CODEBUDDY_GATEWAY_AUTH:-password}
      # Optional: raise the log level to INFO or DEBUG to see credential
      # selection and successful upstream requests (defaults to WARN).
      - CODEBUDDY_LOG_LEVEL=${CODEBUDDY_LOG_LEVEL:-WARN}
      # Memory guards. These exist because the process was killed by the kernel
      # OOM killer several times: the container limit is 2g and RSS was observed
      # at 1.85-2.05g before every kill. Each switch below closes one way the
      # process could get there.
      #
      # Compress oversized conversation history before dispatch. On by default
      # in code as well: the reject cap is applied when the body is read, so an
      # uncompressed body is not "sent as-is", it is refused with a 413.
      - CODEBUDDY_COMPRESS_HISTORY=${CODEBUDDY_COMPRESS_HISTORY:-true}
      # Complete the request shape the upstream's channel check expects. The
      # check refuses roughly eighty percent of bodies that carry no system
      # message at all, with code 11128, while the same traffic with one is
      # refused at around two percent. A one-sentence system prompt is prepended
      # when the caller sent none; bodies that already have one are untouched.
      - CODEBUDDY_INJECT_SYSTEM_PROMPT=${CODEBUDDY_INJECT_SYSTEM_PROMPT:-true}
      # Rewrite another harness's name out of the system prompt before dispatch.
      # The channel check reads the `system` text and refuses a body that names a
      # rival harness, with the same code 11128 as above, before the request is
      # routed to a model. On by default: the refusal is otherwise invisible to
      # the caller, who only sees a 400 that looks like bad input. Set to 0 to
      # forward the prompt verbatim.
      - CODEBUDDY_REWRITE_HARNESS_IDENTITY=${CODEBUDDY_REWRITE_HARNESS_IDENTITY:-true}
      # Largest body dispatched upstream *after* compression, in bytes. Was a
      # 400000-character budget, which measured a different quantity from the
      # byte cap and was roughly 5% of it, so the two never agreed.
      - CODEBUDDY_REQUEST_TARGET_BYTES=${CODEBUDDY_REQUEST_TARGET_BYTES:-1048576}
      # Anomaly guard on an *accepted* body, in bytes. This is not a size
      # policy — the dispatch target above is. It exists only so a runaway or
      # hostile client cannot make the process parse an unbounded body, and it
      # therefore sits far above any real conversation. A session that reaches
      # it is broken, not merely large.
      #
      # The history matters here: 8 MiB was the number that produced the filed
      # 413s, because it fired while reading the body — before the compressor
      # that exists to shrink it ever ran. Raising it to 32 MiB fixed the
      # symptom, but treating the reject cap as the size policy kept the
      # conflation. 64 MiB means only genuinely broken input is refused.
      #
      # Parsed cost is ~4x the wire bytes, and the watchdog's 1700 MiB recycle
      # is the real backstop, not this number.
      - CODEBUDDY_MAX_REQUEST_BYTES=${CODEBUDDY_MAX_REQUEST_BYTES:-67108864}
      # Recycle the process when RSS crosses this many MiB. A controlled exit(0)
      # with a 30s drain is far cheaper than an OOM kill, and swarm restarts the
      # task within seconds. Set to 0 to disable.
      - CODEBUDDY_MEMORY_RECYCLE_MB=${CODEBUDDY_MEMORY_RECYCLE_MB:-1700}
    volumes:
      - codebuddy_creds:/app/.codebuddy_creds
      - codebuddy_data:/app/.codebuddy_data
    # Logs are collected by Promtail from the Docker json-file log of each
    # container. Declaring the `loki` driver here would push straight to Loki
    # instead and blind Promtail, so keep json-file and cap the file instead.
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    # Edge case: on 2026-10-19 the bun process grew to ~3.07 GB and triggered a
    # host-level OOM kill (exit 137), which briefly took the whole host down.
    # A memory limit keeps a runaway process from starving the rest of the host.
    # On a 4 GB host a 2 GB limit leaves room for Postgres and the system.
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    networks:
      - codebuddy-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-codebuddy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-codebuddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - codebuddy-net

volumes:
  codebuddy_creds:
  codebuddy_data:
  postgres_data:

networks:
  codebuddy-net:
