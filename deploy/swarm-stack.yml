# Docker Swarm stack definition for the production deployment.
#
# Deployed on the server with:
#   docker stack deploy -c swarm-stack.yml codebuddy2api
#
# Every secret is injected through the environment instead of being written
# here, so this file is safe to keep in version control. Provide the values in
# the shell that runs `docker stack deploy`, or switch the entries below to
# `docker secret` references.
#
# Notes specific to `docker stack deploy`:
#   - `container_name` and `restart` are compose-only keys and are ignored by
#     swarm; `deploy.restart_policy` is used instead.
#   - `depends_on` only affects startup order, it does not wait for the
#     database to accept connections.
#   - `env_file` is not supported by `docker stack deploy` (`docker compose`
#     only), so the variables are listed explicitly below.

version: '3.8'

services:
  app:
    image: registry.cn-hangzhou.aliyuncs.com/hucx/codebuddy2api:20261021.T01
    ports:
      - '8001:8001'
    environment:
      # Storage backend. Point it at Postgres to use the shared database, or
      # set it to `file` to fall back to the plaintext JSON documents under
      # /app/.codebuddy_creds.
      - CODEBUDDY_STORAGE_BACKEND=${CODEBUDDY_STORAGE_BACKEND:-pg}
      - DATABASE_URL=${DATABASE_URL}
      # Key used to encrypt the documents stored in the database. Keep it in a
      # password manager: without it the encrypted documents cannot be read
      # back, and changing it makes the existing ones undecryptable.
      - CODEBUDDY_STORAGE_ENCRYPTION_KEY=${CODEBUDDY_STORAGE_ENCRYPTION_KEY}
      # Console password and gateway authentication mode.
      - CODEBUDDY_PASSWORD=${CODEBUDDY_PASSWORD}
      - CODEBUDDY_GATEWAY_AUTH=${CODEBUDDY_GATEWAY_AUTH:-password}
      # Optional: raise the log level to INFO or DEBUG to see credential
      # selection and successful upstream requests (defaults to WARN).
      - CODEBUDDY_LOG_LEVEL=${CODEBUDDY_LOG_LEVEL:-WARN}
    volumes:
      - codebuddy_creds:/app/.codebuddy_creds
      - codebuddy_data:/app/.codebuddy_data
    # Logs are collected by Promtail from the Docker json-file log of each
    # container. Declaring the `loki` driver here would push straight to Loki
    # instead and blind Promtail, so keep json-file and cap the file instead.
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    # Edge case: on 2026-10-19 the bun process grew to ~3.07 GB and triggered a
    # host-level OOM kill (exit 137), which briefly took the whole host down.
    # A memory limit keeps a runaway process from starving the rest of the host.
    # On a 4 GB host a 2 GB limit leaves room for Postgres and the system.
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    networks:
      - codebuddy-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-codebuddy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-codebuddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - codebuddy-net

volumes:
  codebuddy_creds:
  codebuddy_data:
  postgres_data:

networks:
  codebuddy-net:
