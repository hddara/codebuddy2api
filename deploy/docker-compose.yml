services:
  codebuddy2api:
    image: ghcr.nju.edu.cn/hddara/codebuddy2api:1.2.1
    restart: unless-stopped
    ports:
      - '8001:8001'
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '8001'
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ../.codebuddy_data:/app/.codebuddy_data
      - ../.codebuddy_creds:/app/.codebuddy_creds
    env_file:
      - path: ../.env
        required: false
