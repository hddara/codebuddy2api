name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (e.g. v1-manual). Leave empty to publish only the commit SHA tag.
        required: false
        default: ''
        type: string
      tag_latest:
        description: Also publish the latest tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.meta.outputs.image }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Compute image name and tags
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
          TAG_LATEST: ${{ inputs.tag_latest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/codebuddy2api"
          short_sha="${GITHUB_SHA::7}"
          tags="${short_sha}"
          if [[ -n "$TAG_INPUT" ]]; then
            tags="${tags},${TAG_INPUT}"
          fi
          if [[ "$TAG_LATEST" == 'true' ]]; then
            tags="${tags},latest"
          fi
          {
            echo "image=$image"
            echo "short_sha=$short_sha"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runs_on: ubuntu-24.04 }
          # arm64 runners are free for public repositories; switch to ubuntu-24.04 with
          # QEMU emulation if the repository is private and no paid runner is available.
          - { arch: arm64, platform: linux/arm64, runs_on: ubuntu-24.04-arm }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=codebuddy2api-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=codebuddy2api-docker-${{ matrix.arch }}

  merge:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ needs.prepare.outputs.image }}
      tags: ${{ needs.prepare.outputs.tags }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            targets+=("-t" "${IMAGE}:${tag}")
          done
          docker buildx imagetools create "${targets[@]}" "${IMAGE}:${SHORT_SHA}-amd64" "${IMAGE}:${SHORT_SHA}-arm64"

      - name: Summarize published image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Published image'
            echo
            echo '| Tag | Pull command |'
            echo '| --- | --- |'
            IFS=',' read -ra tags <<< "$TAGS"
            for tag in "${tags[@]}"; do
              echo "| \`${tag}\` | \`docker pull ${IMAGE}:${tag}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
